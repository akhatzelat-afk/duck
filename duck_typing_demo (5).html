.art.typing{animation:typing .72s steps(5) infinite}
.art.fast{animation:fast .30s steps(5) infinite}
.art.rage{animation:rage .20s steps(5) infinite}
@keyframes typing{from{background-position:-160px 0}to{background-position:-960px 0}}
@keyframes fast{from{background-position:-800px 0}to{background-position:-1600px 0}}

.meter{margin-top:6px;color:#91879a;font-size:11px}
.meter strong{color:#e0bd55}

.sparks{
  position:absolute;
  left:0;top:0;width:100%;height:100%;
  pointer-events:none;
  z-index:50;
  display:none;
}
.sparks.show{display:block}
.spark{
  position:absolute;
  width:5px;height:5px;
  background:#ff4936;
  box-shadow:0 0 8px 2px rgba(255,73,54,.75);
  image-rendering:pixelated;
}
.s1{left:24%;top:38%}.s2{left:33%;top:25%}.s3{left:45%;top:31%}
.s4{left:58%;top:39%}.s5{left:69%;top:49%}.s6{left:29%;top:57%}
.s7{left:52%;top:20%}.s8{left:65%;top:29%}
.sparks.show .s1{animation:sparkA .18s steps(2) infinite}
.sparks.show .s2{animation:sparkB .23s steps(2) infinite}
.sparks.show .s3{animation:sparkA .15s steps(2) infinite}
.sparks.show .s4{animation:sparkB .19s steps(2) infinite}
.sparks.show .s5{animation:sparkA .21s steps(2) infinite}
.sparks.show .s6{animation:sparkB .17s steps(2) infinite}
.sparks.show .s7{animation:sparkA .20s steps(2) infinite}
.sparks.show .s8{animation:sparkB .14s steps(2) infinite}
@keyframes sparkA{50%{transform:translate(4px,-7px) scale(1.5);filter:brightness(1.8)}}
@keyframes sparkB{50%{transform:translate(-4px,6px) scale(.7);filter:brightness(1.8)}}

<body>
<div class="wrap">
  <div class="stage"><div id="art" class="art"></div></div>
  <div class="meter">Скорость: <strong id="speed">0.0</strong> зн/с</div>
</div>
<script>
const duck=document.querySelector('#art');
const sparks=document.querySelector('.sparks');
const speedOut=document.querySelector('#speed');
let lastKey=0, intervals=[], timer=0;

function setState(s){
  duck.className='art '+s;
  sparks.className='sparks'+(s==='rage'?' show':'');
}

function update(){
  const now=performance.now();
  intervals=intervals.filter(x=>now-x.time<900);
  const recent=intervals.filter(x=>x.dt>=25&&x.dt<=900);
  let speed=0;
  if(recent.length){
    const avg=recent.reduce((sum,x)=>sum+x.dt,0)/recent.length;
    speed=1000/avg;
  }
  speedOut.textContent=speed.toFixed(1);
  if(now-lastKey>850)setState('');
  else if(speed>=15)setState('rage');
  else if(speed>=7)setState('fast');
  else setState('typing');
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey||e.repeat)return;
  if(e.key.length!==1&&e.key!=='Backspace'&&e.key!=='Delete')return;
  const now=performance.now();
  if(lastKey){
    const dt=now-lastKey;
    if(dt>=25&&dt<=900)intervals.push({time:now,dt});
  }
  lastKey=now;
  update();
  clearTimeout(timer);
  timer=setTimeout(update,120);
});
setInterval(update,100);
setState('');
</script>
</body>
